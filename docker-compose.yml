services:
    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        working_dir: /app
        volumes:
            - ./frontend:/app
            - /app/node_modules
        stdin_open: true
        tty: true
        env_file:
            - ./frontend/.env.local
        ports:
            - "5173:5173"

    backend:
        build:
            context: ./spring_grpc
            dockerfile: Dockerfile
        ports:
            - "8080:8080"
            - "9090:9090"
        environment:
            GOOGLE_OAUTH_CLIENT_ID: "494375853488-nu5h6bsffjafo3s2srddijrgstqvs7nc.apps.googleusercontent.com"

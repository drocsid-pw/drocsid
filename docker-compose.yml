services:
    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        working_dir: /app
        volumes:
            - ./frontend:/app
            - /app/node_modules
        stdin_open: true
        tty: true

    backend:
      build:
        context: ./spring_grpc
        dockerfile: Dockerfile
      working_dir: /app
    gateway:
      build:
        context: ./nginx
      ports: "8080:8080"

services:
    frontend:
        build:
            context: ./frontend
            dockerfile: Dockerfile
        working_dir: /app
        volumes:
            - ./frontend:/app
            - /app/node_modules
        ports:
            - "5173:5173"
        stdin_open: true
        tty: true

    backend:
      build:
        context: ./spring_grpc
        dockerfile: Dockerfile
      working_dir: /app
      ports:
        - "9090:9090"

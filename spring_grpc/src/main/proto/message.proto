syntax = "proto3";
package message;
option java_package = "com.drocsid.grpc.proto";
option java_multiple_files = true;
import "common.proto";


service MessageService {
  rpc CreateMessage(CreateMessageRequest) returns (common.ResponseMessage);
  rpc GetMessage(MessageId) returns (Message);
  rpc UpdateMessage(UpdateMessageRequest) returns (common.ResponseMessage);
  rpc DeleteMessage(MessageId) returns (common.ResponseMessage);
}

message Message {
  string id = 1;
  string authorId = 2;
  string authorName = 3;
  string timestamp = 4;
  string content = 5;
  string channelId = 6;
}

message CreateMessageRequest {
  string userId = 1;
  string authorId = 2;
  string authorName = 3;
  string content = 4;
  string channelId = 5;
}

message MessageId {
  string userId = 1;
  string id = 2;
}

message UpdateMessageRequest {
  string userId = 1;
  string id = 2;
  string authorName = 3;
  string content = 4;
}

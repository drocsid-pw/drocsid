version: '3.8'

services:
  jenkins:
    build: .
    container_name: jenkins
    user: root
    environment:
      - JAVA_OPTS=-Dhudson.plugins.git.GitSCM.ALLOW_LOCAL_CHECKOUT=true
    ports:
      - "9090:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      # Mount docker socket to allow Jenkins to run docker commands (if needed)
      - /var/run/docker.sock:/var/run/docker.sock
      # Mount local project directory to allow local git checkout
      - ../:/usr/src/drocsid
    restart: unless-stopped

volumes:
  jenkins_home:
